dependencies = [
    "rdkit>=2024.3",
    "biopython>=1.83",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0"]
